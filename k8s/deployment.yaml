apiVersion: apps/v1
kind: Deployment

metadata:
  name: eks-devops-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
        - name: nodejs-container
          image: eks-devops-app:v3
          imagePullPolicy: Never

          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: eks-devops-config
                  key: APP_MESSAGE

            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: eks-devops-secret
                  key: APP_SECRET

          ports:
            - containerPort: 3000
