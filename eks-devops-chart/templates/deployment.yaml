apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-deployment

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "eks-devops-chart.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "eks-devops-chart.name" . }}

    spec:
      containers:
        - name: eks-devops-container

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: message

            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: username

            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: password

{{ range .Values.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
{{ end }}

          ports:
            - containerPort: 3000

{{ if .Values.persistence.enabled }}
          volumeMounts:
            - name: app-storage
              mountPath: /app-data
{{ end }}

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

{{ if .Values.persistence.enabled }}
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc
{{ end }}
